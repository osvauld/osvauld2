[package]
name = "app_engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The engine paints with egui's own epaint (native meshes — no texture round-trip,
# no FFI) and shapes text with egui's fonts, so its frame output is the same shape
# the compositor already consumes from a wasm app. Pinned to the shell's egui.
egui = "0.34"
# Standalone flexbox/grid/block layout. The view tree is laid out by Taffy; text is
# measured back through egui's fonts via Taffy's measure callback.
taffy = "0.10"

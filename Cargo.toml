[workspace]
resolver = "2"
members = [
  "cryptography",
  "identity",
  "storage",
  "vault",
  "shell2",
  "runtime",
  "android_app",
  "app_host",
  "world",
  "lua_tree",
  "osvauld-rpc",
  "workspace",
  "kunki",
  "courier",
  "voice",
  "search",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"

# APKs are stripped; avoid generating the entry crate's large generic debug records first.
[profile.dev.package.android_app]
debug = 0
codegen-units = 16

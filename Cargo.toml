[workspace]
resolver = "2"
members = [
  "cryptography",
  "identity",
  "storage",
  "vault",
  "data",
  "sthalam",
  "compositor",
  "app_host",
  "app_engine",
  "text_edit",
  "rich_text",
  "code_highlight",
  "doc_editor",
  "osvauld-rpc",
  "osvauld-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"

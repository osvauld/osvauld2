[workspace]
resolver = "2"
members = [
  "cryptography",
  "identity",
  "storage",
  "vault",
  "shell2",
  "runtime",
  "app_host",
  "lua_tree",
  "osvauld-rpc",
  "osvauld-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"

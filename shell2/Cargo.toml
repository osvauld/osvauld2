[package]
name = "shell2"
version.workspace = true
edition.workspace = true
license.workspace = true

# shell2 is pure UI: it defines the screens (login, …) and their logic, and hands the first one to
# the runtime. All GPU/window/event-loop/input plumbing lives in `runtime`. vello is a direct dep
# only because screens still draw with raw scene commands (until the element vocab lands).
[dependencies]
runtime = { path = "../runtime" }
app_host = { path = "../app_host" }
vault = { path = "../vault" }
identity = { path = "../identity/" }
vello = "0.9.0"
loro = "1.13.9"
rfd = "0.17.2"
osvauld-rpc = { path = "../osvauld-rpc" }
serde_json = { workspace = true }
base64 = "0.22"
[dev-dependencies]
tempfile = "3"

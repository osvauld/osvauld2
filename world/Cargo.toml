[package]
name = "world"
version.workspace = true
edition.workspace = true
license.workspace = true

# Retained worlds. The only crate that depends on bevy_ecs: Lua and app_host see our entity
# description, never ECS types, so the storage stays replaceable. Pinned — bevy breaks often, and
# 0.19 needs a newer toolchain than the workspace's.
[dependencies]
bevy_ecs = { version = "=0.18.1", default-features = false, features = ["std"] }
runtime = { path = "../runtime" }
glam = "0.30"
# 2D controllers/dynamic bodies and the separate metre-scale 3D solver.
rapier2d = "0.35"
rapier3d = "0.35"
thiserror = { workspace = true }

[package]
name = "app_host"
version.workspace = true
edition.workspace = true
license.workspace = true

# Hosts sandboxed Luau apps on the new runtime. An app's `view()` walks directly into
# `runtime::El<LuaMsg>` — same builders shell2 uses, no parallel node type. `app_engine`
# stays untouched as reference; this is the ground-up rewrite.
[dependencies]
mlua = { version = "0.10", features = ["luau"] }
loro = "1.12.0"
runtime = { path = "../runtime" }
csscolorparser = "0.8.3"
uuid = { version = "1.24.0", features = ["v4"] }

# Tests only, and the direction matters: `lua_tree` must not know what a host is. This is the
# one place the two meet — running printed source to check it still *means* what it meant.
[dev-dependencies]
lua_tree = { path = "../lua_tree" }

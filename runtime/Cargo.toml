[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

# The GUI runtime: owns the winit window + event loop, the wgpu/vello GPU plumbing, text shaping,
# input/hover/dispatch. Apps (e.g. shell2) depend on this and supply `Screen`s; the headless
# `app_engine` stays independent of it.
[dependencies]
winit = "0.30"
wgpu = "29.0.4"
vello = "0.9.0"
parley = "0.11.0"
taffy = "0.12"
pollster = "1.0.1"
env_logger = "0.11"
png = "0.18"

      <stop offset="0" stop-color="#fff3b8"/><stop offset="0.45" stop-color="#ffd23f"/><stop offset="1" stop-color="#d39a00"/>
    </radialGradient>
    <linearGradient id="visor_shade" x1="0" y1="9.6" x2="0" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d5a80"/><stop offset="1" stop-color="#22324a"/>
    </linearGradient>
  </defs>
  <g id="shell" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="16" fill="url(#dome)" stroke="#3e2a1a" stroke-width="1.5"/>
    <path id="stripe" d="M4 5.6 Q16 -2.4 28 5.6" fill="none" stroke="#e8533f" stroke-width="3"/>

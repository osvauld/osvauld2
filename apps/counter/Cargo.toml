[package]
name = "counter-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# A wasm app is a cdylib: the host loads the compiled module and calls its
# exported alloc/dealloc/frame. Build with:
#   cargo build -p counter-app --target wasm32-unknown-unknown --release
[lib]
crate-type = ["cdylib"]

[dependencies]
osvauld-app = { path = "../../osvauld-app" }

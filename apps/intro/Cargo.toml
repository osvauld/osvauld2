[package]
name = "intro-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# The intro/landing app: a "what is osvauld?" post with comments below — the POC
# surface. `cdylib` is the wasm artifact the host loads; `rlib` lets the native
# `preview` example link the same UI. Build the wasm with:
#   cargo build -p intro-app --target wasm32-unknown-unknown --release
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
osvauld-app = { path = "../../osvauld-app" }

# Native-only, for the `preview` example (a desktop window that runs the same
# egui UI directly, so you can see it without the wasm host). Not compiled into
# the wasm app. Run with: cargo run -p intro-app --example preview
[dev-dependencies]
eframe = { version = "0.34", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
